name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Use Gradle cache (faster, more credits)'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      _JAVA_OPTIONS: -Xmx1536m -XX:MaxMetaspaceSize=768m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle
        if: github.event.inputs.use_cache == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/*.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Set up Android SDK and required packages
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
      
      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      
      - name: Create local.properties (point to SDK)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-app/local.properties
      
      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      - name: Build Debug APK (optimized)
        run: |
          set -o pipefail
          ./android-app/gradlew -p android-app clean :app:assembleDebug \
            -x test -x lint -x lintVitalAnalyzeRelease -x lintVitalReportRelease \
            --no-daemon --no-build-cache --no-configuration-cache \
            --max-workers=2 --parallel \
            --warning-mode none 2>&1 | tee gradle-build.log

      - name: Show failing Gradle log tail
        if: failure()
        run: |
          echo "----- Gradle build last 200 lines -----"
          tail -n 200 gradle-build.log || true
          echo "----- End of log tail -----"

      - name: Get version info
        id: version
        run: |
          echo "version=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p apk-output
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apk-output/iftin-delivery.apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Iftin Delivery ${{ steps.version.outputs.version }}
          body: |
            🤖 **Automatic build from GitHub Actions**
            
            📱 **Download APK:**
            Click on `iftin-delivery.apk` below to download
            
            📊 **Build Details:**
            - Version: ${{ steps.version.outputs.version }}
            - Build: #${{ github.run_number }}
            - Date: ${{ steps.version.outputs.date }}
            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            
            💾 **Device Requirements:**
            - Android 10+
            - ~8-10 MB
            
            📋 **Installation:**
            1. Download APK
            2. Enable "Install from Unknown Sources"
            3. Install and grant all permissions
          files: apk-output/iftin-delivery.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
