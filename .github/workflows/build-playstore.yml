name: Build Android AAB for Play Store

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      _JAVA_OPTIONS: -Xmx4096m -XX:MaxMetaspaceSize=1024m
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4096m
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/*.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
      
      - name: Install Android SDK packages
        run: |
          "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-app/local.properties

      - name: Create debug keystore for signing
        run: |
          mkdir -p android-app/app/keystore
          keytool -genkeypair -v \
            -keystore android-app/app/keystore/release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Iftin Internet, OU=Mobile, O=Iftin, L=Mogadishu, ST=Banaadir, C=SO"
      
      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      - name: Build Release AAB
        if: github.event.inputs.build_type == 'release'
        run: |
          set -o pipefail
          ./android-app/gradlew -p android-app clean :app:bundleRelease \
            -x test -x lint \
            --no-daemon --no-build-cache \
            --max-workers=2 --parallel \
            --warning-mode none 2>&1 | tee gradle-build.log
        env:
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: release
          KEY_PASSWORD: android

      - name: Build Debug APK (for testing)
        if: github.event.inputs.build_type == 'debug'
        run: |
          set -o pipefail
          ./android-app/gradlew -p android-app clean :app:assembleDebug \
            -x test -x lint \
            --no-daemon --no-build-cache \
            --max-workers=2 --parallel \
            --warning-mode none 2>&1 | tee gradle-build.log

      - name: Show failing Gradle log tail
        if: failure()
        run: |
          echo "----- Gradle build last 200 lines -----"
          tail -n 200 gradle-build.log || true
          echo "----- End of log tail -----"

      - name: Get version info
        id: version
        run: |
          echo "version=v1.2.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Prepare Release Files
        run: |
          mkdir -p release-output
          if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
            cp android-app/app/build/outputs/bundle/release/app-release.aab release-output/iftin-internet.aab
          else
            cp android-app/app/build/outputs/apk/debug/app-debug.apk release-output/iftin-internet-debug.apk
          fi
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Iftin Internet ${{ steps.version.outputs.version }}
          body: |
            🏪 **Play Store Ready Build**
            
            📱 **Download:**
            - `iftin-internet.aab` - For Google Play Store upload
            - `iftin-internet-debug.apk` - For direct device testing
            
            📊 **Build Details:**
            - Version: ${{ steps.version.outputs.version }}
            - Build: #${{ github.run_number }}
            - Date: ${{ steps.version.outputs.date }}
            - Commit: `${{ github.sha }}`
            - Type: ${{ github.event.inputs.build_type }}
            
            ✨ **Features:**
            - Splash screen with Iftin branding
            - USSD payment automation
            - SMS payment detection
            - Optimized for Play Store
            
            📋 **Play Store Upload:**
            1. Download the .aab file
            2. Go to Google Play Console
            3. Upload to your app's release track
          files: |
            release-output/iftin-internet.aab
            release-output/iftin-internet-debug.apk
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}