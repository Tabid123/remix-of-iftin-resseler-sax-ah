name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [release, debug]
        default: release

jobs:
  build-release:
    # Release APK on every push to main, on tags, and on manual release runs
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == ''))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            echo "Using keystore from secrets"
            exit 0
          fi
          STORE_PW="${KEYSTORE_PASSWORD:-android}"
          ALIAS="${KEY_ALIAS:-release}"
          KEY_PW="${KEY_PASSWORD:-android}"
          # The committed keystore has an unknown key password — always mint a fresh one
          echo "Generating CI signing keystore"
          rm -f app/keystore/release.keystore
          keytool -genkeypair -v \
            -keystore app/keystore/release.keystore \
            -storetype PKCS12 \
            -storepass "$STORE_PW" -keypass "$KEY_PW" \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Iftin Delivery, OU=Iftin, O=Iftin, L=Mogadishu, S=Banadir, C=SO"



      - name: Build Release APK
        env:
          # Fall back to the CI keystore defaults; empty strings break Gradle signing
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace


      - name: Collect APKs
        run: |
          mkdir -p ../artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../artifacts/ \;
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          for f in ../artifacts/*.apk; do
            mv "$f" "../artifacts/iftin-delivery-release-${SHORT_SHA}.apk"
          done
          ls -la ../artifacts

      - name: Publish Release APK to rolling release (main pushes / manual)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-latest
          name: Release APK (latest)
          prerelease: false
          make_latest: "true"
          files: artifacts/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release APK to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  build-debug:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p ../artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} ../artifacts/ \;
          ls -la ../artifacts

      # Artifact storage quota can be full; releases don't use that quota
      - name: Publish Debug APK to rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug APK (latest)
          prerelease: true
          files: artifacts/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
