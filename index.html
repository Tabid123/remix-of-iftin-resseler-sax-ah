    <script>
      // Anti-flash + Android WebView detection (BEFORE React loads)
      (function(){
        // Anti-flash style
        var s=document.createElement('style');
        s.id='anti-flash';
        s.textContent='html,body,#root{background:linear-gradient(135deg,#0099ff 0%,#0066cc 100%)!important;min-height:100vh!important}';
        document.head.appendChild(s);
        
        // Detect Android WebView using User-Agent (works with Capacitor remote URL)
        var ua = navigator.userAgent || '';
        var isAndroidWebView = /Android/.test(ua) && ua.indexOf('wv') > -1;
        if (isAndroidWebView) {
          document.documentElement.style.setProperty('--effective-safe-area-top', '0px');
        } else {
          // iOS/Web: Use env() safe area
          document.documentElement.style.setProperty(
            '--effective-safe-area-top', 
            'env(safe-area-inset-top, 0px)'
          );
        }
      })();

      // Aggressive iOS/WKWebView blank-screen watchdog. Runs immediately in <head>,
      // before deferred/module React code, so a frozen white body can recover itself.
      (function(){
        // Disable aggressive reload watchdog in Lovable preview / iframes —
        // it races against Vite HMR and traps the app in an infinite reload loop.
        var host = (location && location.hostname) || '';
        var inIframe = false;
        try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
        var isPreview = inIframe ||
          host.indexOf('lovableproject.com') > -1 ||
          host.indexOf('lovable.app') > -1 ||
          host.indexOf('id-preview--') > -1 ||
          host === 'localhost' || host === '127.0.0.1';
        if (isPreview) {
          window.__iftinHasRenderedContent = function(){ return true; };
          window.__iftinHardReloadIfBlank = function(){};
          return;
        }

        var HARD_RELOAD_KEY = '__iftin_hard_reload_at__';
        var reloading = false;
        function rootHasAppContent() {
          var root = document.getElementById('root');
          if (!root) return false;
          if (document.getElementById('app-render-sentinel')) return true;
          var cloneText = (root.innerText || '').replace(/\s+/g, ' ').trim();
          return !!window.__APP_MOUNTED__ || (!!cloneText && !/^Internet ma jiro\.|^Sii wad Offline Mode$/.test(cloneText));
        }

        function looksWhiteOrEmpty() {
          var body = document.body;
          if (!body) return false;
          if (rootHasAppContent()) return false;
          var root = document.getElementById('root');
          var bodyText = (body.innerText || '').replace(/\s+/g, ' ').trim();
          var hasVisibleDom = !!(root && root.children && root.children.length > 0) || body.children.length > 1 || bodyText.length > 0;
          // NOTE: do NOT check getComputedStyle(body).backgroundColor — gradient backgrounds
          // report rgba(0,0,0,0) which would falsely trigger reloads forever.
          return !hasVisibleDom;
        }

        function hardReload(reason) {
          if (reloading || rootHasAppContent()) return;
          reloading = true;
          try { sessionStorage.setItem(HARD_RELOAD_KEY, String(Date.now())); } catch(e) {}
          console.warn('[iOS Watchdog] hard reload:', reason);
          window.location.href = window.location.href;
        }

        window.__iftinHasRenderedContent = rootHasAppContent;
        window.__iftinHardReloadIfBlank = function(reason) {
          if (!rootHasAppContent()) hardReload(reason || 'blank');
        };

        setInterval(function(){
          if (document.visibilityState === 'hidden') return;
          if (looksWhiteOrEmpty()) hardReload('empty-white-body');
        }, 2000);

        setTimeout(function(){
          if (!rootHasAppContent()) hardReload('no-content-after-5s');
        }, 5000);
      })();
    </script>

  <body style="background:linear-gradient(135deg,#0099ff 0%,#0066cc 100%);margin:0;padding:0;min-height:100vh;">
    <div id="root" style="background:linear-gradient(135deg,#0099ff 0%,#0066cc 100%);min-height:100vh;">
      <!-- Initial Web Splash Screen - replaced by React when loaded -->
      <div id="initial-splash">
        <img src="/images/iftin-splash-logo.png" alt="Iftin Internet" class="splash-logo">
        <div class="loading-spinner"></div>
        <!-- Native HTML offline fallback button — works even if React JS fails to boot offline (iOS WKWebView). -->
        <div id="native-offline-fallback" style="display:none;margin-top:32px;text-align:center;color:#fff;max-width:300px;padding:0 16px;">
          <p style="font-size:14px;line-height:1.5;margin:0 0 16px 0;opacity:0.95;">
            Internet ma jiro. Waxaad sii isticmaali kartaa Offline Mode.
          </p>
          <button id="native-offline-btn" style="background:#fff;color:#0066cc;border:0;padding:14px 24px;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;width:100%;">
            Sii wad Offline Mode
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Silent boot watchdog: if React doesn't mount in time, show native offline button
      // so iOS users (where SW often fails offline in WKWebView) are NEVER stuck on splash.
      (function () {
        var WATCHDOG_MS = 6000;
        var RELOAD_KEY = '__iftin_boot_reloads__';

        var showNativeOfflineFallback = function () {
          var el = document.getElementById('native-offline-fallback');
          if (el) el.style.display = 'block';
        };

        // Wire button: navigate to /providers (offline mode supported there) without needing React first
        document.addEventListener('DOMContentLoaded', function () {
          var btn = document.getElementById('native-offline-btn');
          if (btn) {
            btn.addEventListener('click', function () {
              try { sessionStorage.setItem('appInitialized', 'true'); } catch (e) {}
              // Force a reload at /providers — by then either React boots, or SW serves cached shell
              window.location.replace('/providers');
            });
          }
        });

        setTimeout(function () {
          if (window.__APP_MOUNTED__) return;

          // If we're offline, do NOT silently reload (that just shows white again on iOS).
          // Show the native fallback button instead so user can proceed.
          if (typeof navigator !== 'undefined' && navigator.onLine === false) {
            showNativeOfflineFallback();
            return;
          }

          try {
            var n = parseInt(sessionStorage.getItem(RELOAD_KEY) || '0', 10);
            if (n >= 2) {
              // Stop reloading; show fallback so user can still proceed
              showNativeOfflineFallback();
              return;
            }
            sessionStorage.setItem(RELOAD_KEY, String(n + 1));
          } catch (e) {}
          window.location.reload();
        }, WATCHDOG_MS);

        // Also expose fallback after a longer wait regardless (safety net for iOS)
        setTimeout(function () {
          if (!window.__APP_MOUNTED__) showNativeOfflineFallback();
        }, 9000);

        // Reset reload counter once app successfully mounts
        window.addEventListener('app:mounted', function () {
          try { sessionStorage.removeItem(RELOAD_KEY); } catch (e) {}
        });
      })();
    </script>
