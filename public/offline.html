<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0066cc">
  <title>Iftin Internet</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(135deg, #0099ff 0%, #0066cc 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .box { max-width: 340px; }
    .logo { width: 110px; height: 110px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    p { font-size: 15px; opacity: .9; line-height: 1.5; margin: 8px 0 20px; }
    .spinner {
      width: 36px; height: 36px; margin: 12px auto;
      border: 4px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button {
      margin-top: 8px;
      background: #fff; color: #0066cc;
      border: 0; padding: 12px 22px;
      border-radius: 10px;
      font-weight: 700; font-size: 16px;
      cursor: pointer;
    }
    .status { margin-top: 14px; font-size: 13px; opacity: .8; }
  </style>
</head>
<body>
  <div class="box">
    <img class="logo" src="/images/iftin-splash-logo.png" alt="Iftin Internet" onerror="this.style.display='none'">
    <h1>Iftin Internet</h1>
    <p>Internetkaagu wuu jabay ama server-ka ayaa cilad ku jirta. Marka internet la helo, app-ku si toos ah ayuu u soo bilaaban doonaa.</p>
    <div class="spinner"></div>
    <button onclick="tryReload()">Isku day mar kale</button>
    <div class="status" id="status">Sugaya internetka…</div>
  </div>
  <script>
    function tryReload() { try { location.replace('/'); } catch(e) { location.reload(); } }
    function updateStatus() {
      var el = document.getElementById('status');
      if (!el) return;
      el.textContent = navigator.onLine ? 'Internet waa la helay — soo bilaabaya…' : 'Sugaya internetka…';
    }
    window.addEventListener('online', function () { updateStatus(); setTimeout(tryReload, 600); });
    window.addEventListener('offline', updateStatus);
    // Auto-retry every 4s when online comes back
    setInterval(function () { if (navigator.onLine) tryReload(); }, 4000);
    updateStatus();
  </script>
</body>
</html>
